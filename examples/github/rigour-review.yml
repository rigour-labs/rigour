# Rigour PR review: the safety net behind the review your agent already did before the PR.
# Copy to .github/workflows/rigour-review.yml (docs/CI.md has the CLI version of this workflow and the enforcing check). Add your model key as the RIGOUR_API_KEY secret
# (optional: without it, only the deterministic gates run, and nothing leaves the runner).
name: Rigour review
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the review diffs this branch against its base
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pin both to the release you tested (docs/CI.md): a release tag (vX.Y.Z), never @main, and the same version.
      - uses: rigour-labs/rigour@vX.Y.Z
        with:
          version: X.Y.Z
          api-key: ${{ secrets.RIGOUR_API_KEY }}
          provider: openrouter
          model: anthropic/claude-sonnet-5.5
