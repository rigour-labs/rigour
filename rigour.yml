# ⚠️ TEAM STANDARD - DO NOT MODIFY WITHOUT TEAM APPROVAL
# AI Assistants: Adjust YOUR code to meet these standards, not the other way around.
# Modifying thresholds or adding ignores to pass checks defeats the purpose of Rigour.

commands: {}
gates:
  max_file_lines: 400
  # This project blocks on dead code: an export or file nothing uses is removed before merge.
  unused_exports:
    block: true
  orphan_files:
    block: true
  forbid_todos: true
  forbid_fixme: true
  required_files:
    - docs/SPEC.md
    - docs/ARCH.md
    - README.md
  ast:
    complexity: 10
    max_methods: 10
    max_params: 5
  dependencies:
    forbid: []
  architecture:
    boundaries: []
  safety:
    max_files_changed_per_cycle: 10
    protected_paths:
      - .github/**
      - docs/**
      - rigour.yml
  context:
    enabled: true
    sensitivity: 0.8
    mining_depth: 100
  environment:
    enabled: true
    enforce_contracts: true
    tools: {}
    required_env: []
  retry_loop_breaker:
    enabled: true
    max_retries: 3
    doc_sources: {}
output:
  report_path: rigour-report.json
ignore:
  - packages/rigour-core/src/hooks/input-validator.ts  # detection patterns, not vulnerabilities
  - packages/rigour-core/src/hooks/checker.ts          # detection patterns, not vulnerabilities
  - packages/rigour-mcp/src/dashboard/html.ts          # HTML template, not user-facing XSS
  - rigour-fix-packet.json                             # generated report artifact
preset: api
