name: Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  test:
    name: Test & Build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Accuracy Benchmark Gate
        run: pnpm accuracy:check

  release:
    name: Release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    outputs:
      cli_version: ${{ steps.capture_version.outputs.cli_version }}
      # True only when a new npm version was published this run.
      did_release: ${{ steps.capture_version.outputs.published == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Verify brain package executables
        run: pnpm verify:brain-packages

      - name: Verify release readiness
        run: pnpm verify:release

      - name: Detect existing release tag on HEAD
        id: release_guard
        run: |
          set -euo pipefail
          if printf '%s' "${{ github.event.head_commit.message }}" | grep -q '\[skip release\]'; then
            VERSION=$(npm view @rigour-labs/cli version)
            echo "Commit requests [skip release]. Using published CLI ${VERSION}."
            echo "skip_release=true" >> "$GITHUB_OUTPUT"
            echo "existing_tag=v${VERSION}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          EXISTING_TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [ -n "${EXISTING_TAG}" ]; then
            VERSION="${EXISTING_TAG#v}"
            PUBLISHED=$(npm view "@rigour-labs/cli@${VERSION}" version 2>/dev/null || true)
            if [ "${PUBLISHED}" = "${VERSION}" ]; then
              echo "Found release tag ${EXISTING_TAG} on HEAD and npm has ${VERSION}. Skipping semantic-release rerun."
              echo "skip_release=true" >> "$GITHUB_OUTPUT"
              echo "existing_tag=${EXISTING_TAG}" >> "$GITHUB_OUTPUT"
            else
              echo "Orphaned tag ${EXISTING_TAG} on HEAD (npm latest: ${PUBLISHED:-none}). Removing tag so release can retry."
              git tag -d "${EXISTING_TAG}"
              git push origin ":refs/tags/${EXISTING_TAG}"
              echo "skip_release=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No release tag on HEAD. Proceeding with semantic-release."
            echo "skip_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upgrade npm for provenance publishing
        if: steps.release_guard.outputs.skip_release != 'true'
        run: npm install -g npm@latest

      - name: Verify npm publish credentials
        if: steps.release_guard.outputs.skip_release != 'true'
        run: |
          set -euo pipefail
          if ! npm whoami; then
            echo "::error::NPM publish auth failed. Update the NPM_TOKEN GitHub secret with a current npm automation token that can publish to @rigour-labs/*, or configure npm trusted publishing for workflow pipeline.yml."
            exit 1
          fi

      - name: Release
        id: semantic_release
        if: steps.release_guard.outputs.skip_release != 'true'
        run: |
          set -euo pipefail
          set +e
          npx semantic-release 2>&1 | tee /tmp/semantic-release.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -Eq 'Published release[[:space:]]+v?[0-9]+\.[0-9]+\.[0-9]+' /tmp/semantic-release.log; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "No new npm version published."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture released CLI version
        id: capture_version
        run: |
          set -euo pipefail
          if [ "${{ steps.release_guard.outputs.skip_release }}" = "true" ]; then
            VERSION="${{ steps.release_guard.outputs.existing_tag }}"
            VERSION="${VERSION#v}"
            echo "published=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.semantic_release.outputs.published }}" = "true" ]; then
            VERSION=$(node -p "require('./packages/rigour-cli/package.json').version")
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(npm view @rigour-labs/cli version)
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
          echo "cli_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish Homebrew Formula
        if: success() && steps.capture_version.outputs.published == 'true'
        env:
          HOMEBREW_TAP_GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GH_TOKEN }}
          HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'rigour-labs/homebrew-tap' }}
        run: |
          set -euo pipefail

          if [ -z "${HOMEBREW_TAP_GH_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_GH_TOKEN is not set. Skipping Homebrew publish."
            exit 0
          fi

          VERSION=$(node -p "require('./packages/rigour-cli/package.json').version")
          TARBALL_URL="https://registry.npmjs.org/@rigour-labs/cli/-/cli-${VERSION}.tgz"
          TARBALL_PATH="/tmp/rigour-cli-${VERSION}.tgz"

          echo "Preparing Homebrew formula for version ${VERSION}"
          curl -fsSL "${TARBALL_URL}" -o "${TARBALL_PATH}"
          SHA256=$(sha256sum "${TARBALL_PATH}" | awk '{print $1}')

          TAP_DIR="/tmp/homebrew-tap"
          rm -rf "${TAP_DIR}"
          git clone "https://x-access-token:${HOMEBREW_TAP_GH_TOKEN}@github.com/${HOMEBREW_TAP_REPO}.git" "${TAP_DIR}"

          mkdir -p "${TAP_DIR}/Formula"
          cat > "${TAP_DIR}/Formula/rigour.rb" <<EOF
          class Rigour < Formula
            desc "Rigour CLI quality gates for AI-generated code"
            homepage "https://github.com/rigour-labs/rigour"
            url "${TARBALL_URL}"
            sha256 "${SHA256}"
            license "MIT"

            depends_on "node"

            def install
              # Fresh publishes must install immediately in CI / same-day brew installs.
              # Homebrew/npm may otherwise enforce a min-release-age window (ETARGET).
              system "npm", "install", "--min-release-age=0", *std_npm_args(prefix: libexec)
              bin.install_symlink Dir["#{libexec}/bin/*"]
            end

            test do
              system "#{bin}/rigour", "--version"
            end
          end
          EOF

          cd "${TAP_DIR}"
          ruby -c Formula/rigour.rb
          grep -q 'std_npm_args(prefix: libexec)' Formula/rigour.rb
          if grep -q 'std_npm_args(libexec)' Formula/rigour.rb; then
            echo "Invalid Homebrew formula: legacy std_npm_args(libexec) detected."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/rigour.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula already up to date."
            exit 0
          fi
          git commit -m "chore: bump rigour to v${VERSION}"
          git push origin HEAD
          echo "Homebrew formula updated in ${HOMEBREW_TAP_REPO}"

      - name: Publish to MCP Registry
        if: success() && steps.capture_version.outputs.published == 'true'
        working-directory: packages/rigour-mcp
        run: |
          # Get the version from the package.json which was just updated by semantic-release
          VERSION=$(node -p "require('./package.json').version")
          
          echo "Syncing server.json to version $VERSION"
          jq ".version = \"$VERSION\" | .packages[0].version = \"$VERSION\"" server.json > server.json.tmp && mv server.json.tmp server.json
          
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz
          chmod +x mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  distribution-smoke:
    name: Distribution Smoke
    needs: release
    # Smoke the currently published CLI after every successful main release job (publish or not).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      EXPECTED_CLI_VERSION: ${{ needs.release.outputs.cli_version }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Verify npx command
        shell: bash
        run: |
          set -euo pipefail
          expected="${EXPECTED_CLI_VERSION}"
          out=$(npx -y "@rigour-labs/cli@${expected}" --version)
          actual=$(printf '%s' "$out" | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | tail -n1 || true)
          if [ -z "$actual" ]; then
            echo "No CLI version found in output: $out"
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "npx version mismatch: expected $expected, got $actual"
            exit 1
          fi
          echo "npx version OK: $actual"

      - name: Verify global npm install
        shell: bash
        run: |
          set -euo pipefail
          expected="${EXPECTED_CLI_VERSION}"
          npm install -g "@rigour-labs/cli@${expected}"
          out=$(rigour --version)
          actual=$(printf '%s' "$out" | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | tail -n1 || true)
          if [ -z "$actual" ]; then
            echo "No global CLI version found in output: $out"
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "global npm version mismatch: expected $expected, got $actual"
            exit 1
          fi
          echo "global npm version OK: $actual"

      - name: Verify hooks checker command path (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rigour-smoke
          echo "export const x = 1;" > /tmp/rigour-smoke/sample.ts
          cd /tmp/rigour-smoke
          rigour hooks check --files sample.ts

      - name: Verify hooks checker command path (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="${RUNNER_TEMP:-/tmp}/rigour-smoke"
          mkdir -p "$smoke_dir"
          echo "export const x = 1;" > "$smoke_dir/sample.ts"
          cd "$smoke_dir"
          rigour hooks check --files sample.ts

      - name: Verify Homebrew install (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # Homebrew's npm install may enforce min-release-age; freshly published
          # @rigour-labs/* versions must still be installable in same-day smoke.
          export NPM_CONFIG_MIN_RELEASE_AGE=0
          brew tap rigour-labs/tap
          brew trust rigour-labs/tap
          brew install rigour
          expected="${EXPECTED_CLI_VERSION}"
          out=$(rigour --version)
          actual=$(printf '%s' "$out" | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | tail -n1 || true)
          if [ -z "$actual" ]; then
            echo "No brew CLI version found in output: $out"
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "brew version mismatch: expected $expected, got $actual"
            exit 1
          fi
          echo "brew version OK: $actual"
